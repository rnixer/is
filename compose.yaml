services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: igh_ess
      POSTGRES_USER: igh
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-development-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igh -d igh_ess"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
