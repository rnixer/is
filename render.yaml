services:
  - type: web
    name: igh-ess-cms
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build -w @igh/cms
    startCommand: npm run start:render
    healthCheckPath: /_health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: '5432'
      - key: DATABASE_NAME
        value: postgres
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      - key: DATABASE_SSL_CA
        sync: false
      - key: DATABASE_POOL_MIN
        value: '0'
      - key: DATABASE_POOL_MAX
        value: '5'
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: STOREFRONT_TOKEN
        generateValue: true
      - key: STOREFRONT_URL
        value: https://is-mix14.vercel.app
      - key: UPLOAD_PROVIDER
        value: aws-s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: product-images
      - key: S3_PUBLIC_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_MODE
        value: test
      - key: STRAPI_TELEMETRY_DISABLED
        value: 'true'
